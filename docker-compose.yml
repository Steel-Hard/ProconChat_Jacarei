version: '3.8'

services:
  # Servidor do Ollama que roda o modelo
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  # Container temporário para baixar o modelo automaticamente
  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama_puller
    volumes:
      - ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    command: -c "sleep 5 && ollama pull llama3.2:3b"
    depends_on:
      - ollama

  # aplicação principal (backned)
  app:
    build: ./app
    container_name: backend
    ports:
      - "3030:3030"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_storage:
